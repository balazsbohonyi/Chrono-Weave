<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>ChronoWeave Timeline</title>
  <script>
    // Apply the saved preference before styles or React render.
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('chrono_theme') === 'dark' ? 'dark' : 'light';
    } catch {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'canvas': 'rgb(var(--color-canvas) / <alpha-value>)',
            'surface': 'rgb(var(--color-surface) / <alpha-value>)',
            'surface-subtle': 'rgb(var(--color-surface-subtle) / <alpha-value>)',
            'surface-muted': 'rgb(var(--color-surface-muted) / <alpha-value>)',
            'surface-placeholder': 'rgb(var(--color-surface-placeholder) / <alpha-value>)',
            'surface-card': 'rgb(var(--color-surface-card) / <alpha-value>)',
            'surface-card-hover': 'rgb(var(--color-surface-card-hover) / <alpha-value>)',
            'card-muted': 'rgb(var(--color-card-muted) / <alpha-value>)',
            'card-border': 'rgb(var(--color-card-border) / <alpha-value>)',
            'surface-dialog-header': 'rgb(var(--color-surface-dialog-header) / <alpha-value>)',
            'surface-connector': 'rgb(var(--color-surface-connector) / <alpha-value>)',
            'connector-border': 'rgb(var(--color-connector-border) / <alpha-value>)',
            'card-source-border': 'rgb(var(--color-card-source-border) / <alpha-value>)',
            'card-target-border': 'rgb(var(--color-card-target-border) / <alpha-value>)',
            'summary-surface': 'rgb(var(--color-summary-surface) / <alpha-value>)',
            'summary-text': 'rgb(var(--color-summary-text) / <alpha-value>)',
            'summary-border': 'rgb(var(--color-summary-border) / <alpha-value>)',
            'action-surface': 'rgb(var(--color-action-surface) / <alpha-value>)',
            'action-surface-hover': 'rgb(var(--color-action-surface-hover) / <alpha-value>)',
            'action-border': 'rgb(var(--color-action-border) / <alpha-value>)',
            'action-text': 'rgb(var(--color-action-text) / <alpha-value>)',
            'tab-selected': 'rgb(var(--color-tab-selected) / <alpha-value>)',
            'tab-badge': 'rgb(var(--color-tab-badge) / <alpha-value>)',
            'tab-badge-text': 'rgb(var(--color-tab-badge-text) / <alpha-value>)',
            'close-surface': 'rgb(var(--color-close-surface) / <alpha-value>)',
            'close-text': 'rgb(var(--color-close-text) / <alpha-value>)',
            'close-border': 'rgb(var(--color-close-border) / <alpha-value>)',

            'separator-muted': 'rgb(var(--color-separator-muted) / <alpha-value>)',
            'border-subtle': 'rgb(var(--color-border-subtle) / <alpha-value>)',
            'border': 'rgb(var(--color-border) / <alpha-value>)',
            'border-strong': 'rgb(var(--color-border-strong) / <alpha-value>)',

            'accent-border': 'rgb(var(--color-accent-border) / <alpha-value>)',
            'accent-border-strong': 'rgb(var(--color-accent-border-strong) / <alpha-value>)',
            'accent-focus': 'rgb(var(--color-accent-focus) / <alpha-value>)',
            'accent-marker': 'rgb(var(--color-accent-marker) / <alpha-value>)',
            'accent-text': 'rgb(var(--color-accent-text) / <alpha-value>)',
            'accent-text-hover': 'rgb(var(--color-accent-text-hover) / <alpha-value>)',
            'accent-heading': 'rgb(var(--color-accent-heading) / <alpha-value>)',

            'success-heading': 'rgb(var(--color-success-heading) / <alpha-value>)',
            'danger-soft': 'rgb(var(--color-danger-soft) / <alpha-value>)',
            'danger-border': 'rgb(var(--color-danger-border) / <alpha-value>)',
            'danger-marker': 'rgb(var(--color-danger-marker) / <alpha-value>)',

            'interaction': 'rgb(var(--color-interaction) / <alpha-value>)',

          boxShadow: {
            sm: '0 1px 2px 0 rgb(var(--color-shadow) / 0.05)',
            DEFAULT: '0 1px 3px 0 rgb(var(--color-shadow) / 0.1), 0 1px 2px -1px rgb(var(--color-shadow) / 0.1)',
            md: '0 4px 6px -1px rgb(var(--color-shadow) / 0.1), 0 2px 4px -2px rgb(var(--color-shadow) / 0.1)',
            lg: '0 10px 15px -3px rgb(var(--color-shadow) / 0.1), 0 4px 6px -4px rgb(var(--color-shadow) / 0.1)',
            xl: '0 20px 25px -5px rgb(var(--color-shadow) / 0.1), 0 8px 10px -6px rgb(var(--color-shadow) / 0.1)',
            '2xl': '0 25px 50px -12px rgb(var(--color-shadow) / 0.25)',
          },
          dropShadow: {
            sm: '0 1px 1px rgb(var(--color-shadow) / 0.05)',
          },
          animation: {
            'pulse-limited': 'pulseLimited 3s ease-in-out 1 forwards', // 5 beats roughly
          },
          keyframes: {
            pulseLimited: {
              '0%, 100%': { transform: 'scale(1)', opacity: '1' },
              '10%, 30%, 50%, 70%, 90%': { transform: 'scale(1.05)', opacity: '1' },
              '20%, 40%, 60%, 80%': { transform: 'scale(1)', opacity: '0.9' },
            }
          }
        }
      }
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
